[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-english-assistant"
version = "0.1.2"
description = "Windows desktop resource assistant for Daily English Listening uploads"
license = {text = "GPL-3.0; see THIRD_PARTY_LICENSES.md"}
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "faster-whisper>=1.2",
  "imageio-ffmpeg>=0.6",
  "yt-dlp==2026.8.19",
]

[project.scripts]
daily-english-assistant = "daily_english.ui:run"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
