name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: pwsh
        run: .\setup_windows.ps1
      - name: Test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "app"
          .\.venv\Scripts\python.exe -m pytest -q
      - name: Build EXE
        shell: pwsh
        run: .\build_windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-english-resource-assistant-windows
          path: dist/每日英语听力资源助手/
          if-no-files-found: error
